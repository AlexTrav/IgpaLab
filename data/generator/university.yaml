# Структура университета «Туран»: факультеты, высшие школы и образовательные программы.
# Источник: turan.edu.kz (собрано в проекте TuranAssist 07.10.2026): страницы факультетов и магистратуры.
# Допущения: распределение ОП по высшим школам – по названиям; веса популярности ОП и факультетов;
# сдвиги склонностей по факультетам; темы для названий мероприятий.
# Факультет делового администрирования (MBA, EMBA, DBA) и подготовительный в стенд не входят.
faculties:
  - name: Гуманитарно-юридический факультет
    weight: 0.36
    shift: {r: 0.0, s: 0.15}     # больше дебатов и общественных проектов
    topics: [Медиа и общество, Права человека, Международная безопасность, Психология личности,
             Перевод и межкультурная коммуникация, Туризм Казахстана, Цифровое право]
    schools:
      - name: Высшая школа медиа и межкультурной коммуникации
        bachelor: {Журналистика: 1.0, Связь с общественностью: 0.8, Переводческое дело: 1.0}
        master: {Журналистика: 0.8}
      - name: Высшая школа психологии
        bachelor: {Психология: 1.5, Клиническая психология: 0.6}
        master: {Психология: 1.0, Клиническая психология: 0.5}
      - name: Высшая школа права
        bachelor: {Юриспруденция: 2.0, Международное право: 1.0,
                   Правовое сопровождение бизнеса (Корпоративный юрист): 0.5}
        master: {Юриспруденция: 1.2}
      - name: Высшая школа международных отношений и дипломатии
        bachelor: {Международные отношения: 1.2, Регионоведение: 0.5}
        master: {Международные отношения: 0.8}
      - name: Высшая школа туризма и гостеприимства
        bachelor: {Туризм: 0.9, Ресторанное дело и гостиничный бизнес: 0.7,
                   Менеджмент инноваций туризма и гостеприимства: 0.4}
        master: {Туризм: 0.5}

  - name: Экономический факультет
    weight: 0.40
    shift: {r: 0.05, s: 0.0}
    topics: [Цифровая экономика, Финансовые рынки, Устойчивое развитие, Логистика и цепи поставок,
             Маркетинг в социальных сетях, Анализ данных в бизнесе, Робототехника и автоматизация]
    schools:
      - name: Высшая школа экономики и менеджмента
        bachelor: {Экономика: 1.0, Мировая экономика: 0.6, Менеджмент: 1.2, Государственное и местное управление: 0.5}
        master: {Экономика: 0.8, Менеджмент: 1.0}
      - name: Высшая школа информационных технологий
        bachelor: {Информационные системы: 1.2, Интеллектуальная робототехника: 0.5}
        master: {Информационные системы: 0.8, Управление ИТ услугами: 0.5}
      - name: Высшая школа маркетинга и логистики
        bachelor: {Маркетинг: 1.0, Логистика: 0.7}
        master: {Маркетинг: 0.6}
      - name: Высшая школа финансов и учета
        bachelor: {Финансы: 1.3, Учёт и аудит: 0.9}
        master: {Финансы: 1.0, Учёт и аудит: 0.6}

  - name: Факультет «Цифровые технологии и искусство»
    weight: 0.24
    shift: {r: 0.1, s: 0.1}      # хакатоны, творческие проекты
    topics: [Машинное обучение, Кибербезопасность, Разработка игр, Телекоммуникационные сети,
             Цифровое кино, Компьютерное зрение, Интернет вещей]
    schools:
      - name: Высшая школа «Turan Film Academy»
        bachelor: {Режиссура: 0.8, Операторское искусство: 0.5, Продюсирование кино и ТВ: 0.5, Актерское искусство: 0.5}
        master: {Режиссура: 0.5, Операторское искусство: 0.3, Режиссура драматического театра: 0.3}
      - name: Высшая школа телекоммуникаций
        bachelor: {"Радиотехника, электроника и телекоммуникации": 0.6}
        master: {}
      - name: Высшая школа компьютерной инженерии
        bachelor: {Вычислительная техника и программное обеспечение: 1.4, Программная инженерия: 1.0}
        master: {Вычислительная техника и программное обеспечение: 0.8}

# названия записей в АСУ (поле «Наименование» студент пишет сам): {t} – тема факультета
