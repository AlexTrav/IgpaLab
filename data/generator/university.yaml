    - "Выступление на секции «{t}»"
  IROS_PUBLICATION:
    - "Статья «{t}»"
    - "Тезисы доклада «{t}»"
    - "Свидетельство об авторском праве: {t}"
  IROS_PROJECT:
    - "Научный проект «{t}»"
    - "Стартап «{t}»"
    - "Резидент бизнес-инкубатора: {t}"
  IROS_INTERNSHIP:
