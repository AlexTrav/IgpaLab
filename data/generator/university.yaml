    - "Член организации «{org}»"
    - "Староста академической группы"
  SSCI_LEADERSHIP:
    - "Руководитель организации «{org}»"
    - "Инициатива «{e}»"
  SSCI_UNIVERSITY_IMAGE:
    - "Публикация об университете в СМИ"
    - "Интервью для медиа университета"
    - "Ведение аккаунта «{org}»"
  SSCI_UNIT_VOLUNTEER:
    - "Волонтерство: {unit}"
fill:
  e: [Добро, Зеленый кампус, Читаем вместе, Шаг навстречу, Город без барьеров, Наурыз, Turan Fest]
  sport: [мини-футбол, волейбол, баскетбол, настольный теннис, шахматы, тогызкумалак, легкая атлетика]
  img: [Мистер и Мисс «Туран», Посвящение в студенты, Вручение дипломов, Этнофестиваль]
  org: [Студенческий совет, Дебатный клуб, Turan Media, Научное общество студентов, Киноклуб TFA]
